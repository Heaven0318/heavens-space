<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Inbox — Heaven's Space</title><link rel="stylesheet" href="owner.css"></head>
<body><main class="shell"><header><div><a href="../index.html">← HEAVEN'S SPACE</a><h1>OWNER INBOX</h1></div><button id="logout" hidden>LOG OUT</button></header>
<section id="login-panel"><p class="eyebrow">PRIVATE / OWNER ACCESS</p><form id="login-form"><label>Email<input id="login-email" type="email" autocomplete="username" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" required></label><button type="submit">SIGN IN →</button><p id="login-status" role="status"></p></form><button id="forgot-password" class="text-button" type="button">FORGOT PASSWORD?</button></section>
<section id="password-panel" hidden><p class="eyebrow">ACCOUNT SETUP / PASSWORD RESET</p><h2>Choose a password</h2><form id="password-form"><label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">SAVE PASSWORD →</button><p id="password-status" role="status"></p></form></section>
<form id="reset-form" hidden><p>Enter your account email and we’ll send a password reset link if the account is eligible.</p><label>Email<input id="reset-email" type="email" autocomplete="email" required></label><button type="submit">SEND RESET LINK →</button><p id="reset-status" role="status"></p></form>
<section id="inbox-panel" hidden><div class="toolbar"><input id="search" type="search" placeholder="Search messages" aria-label="Search messages"><select id="filter" aria-label="Filter messages"><option value="all">All</option><option value="unread">Unread</option><option value="read">Read</option><option value="archived">Archived</option></select><button id="refresh">REFRESH</button></div><p id="inbox-status" role="status"></p><div id="message-list"></div></section>
</main><script src="../js/config.js?v=2"></script><script src="owner.js"></script></body></html>
